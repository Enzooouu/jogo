# Hospedagem no Render (https://render.com): o servidor do jogo com online,
# contas e amigos. No Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: elementum
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: TRUST_PROXY
        value: "1"
      - key: DB_PATH
        value: /tmp/elementum/brawl.db
